<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>敏利 MINLI</title>
  <link rel="stylesheet" href="styles.css" />
  <style>
    html, body { margin: 0; padding: 0; background: #faf8f4; }
    body { font-family: 'Manrope', 'Noto Sans TC', system-ui, sans-serif; }
    #root { width:100%; }
    .react-error { padding: 40px; font-family: monospace; color:#c8231f; white-space: pre-wrap; }
  </style>
  <script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
</head>
<body>
  <template id="__bundler_thumbnail">
    <svg viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg">
      <rect width="200" height="200" fill="#faf8f4"/>
      <rect x="30" y="30" width="140" height="140" rx="20" fill="#c97a48"/>
      <text x="100" y="128" text-anchor="middle" font-family="Noto Serif TC, serif" font-size="80" font-weight="700" fill="#fff">敏</text>
    </svg>
  </template>

  <div id="root"></div>
  <div id="__err_log" style="position:fixed;bottom:0;left:0;right:0;max-height:40vh;overflow:auto;background:#1a0505;color:#ff8a80;font:12px/1.6 monospace;padding:12px 16px;z-index:99999;display:none;white-space:pre-wrap;"></div>

  <script>
    window.__logErr = function(label, e) {
      var el = document.getElementById('__err_log');
      el.style.display = 'block';
      el.textContent += '[' + label + '] ' + (e && (e.stack || e.message || e)) + '\n';
    };
    window.addEventListener('error', function(e) {
      window.__logErr('global', e.message + ' (' + (e.filename||'?') + ':' + e.lineno + ')');
    });
  </script>

  <script type="text/babel" src="shared.jsx"></script>
  <script type="text/babel" src="v1.jsx"></script>
  <script type="text/babel" src="pages.jsx"></script>
  <script type="text/babel" src="about.jsx"></script>
  <script type="text/babel" src="brand-pages.jsx"></script>
  <script type="text/babel" src="mobile-home.jsx"></script>
  <script type="text/babel" src="mobile-pages.jsx"></script>
  <script type="text/babel" src="mobile-about-brands.jsx"></script>
  <script type="text/babel" src="cart.jsx"></script>
  <script type="text/babel" src="site.jsx"></script>

  <script>
    (function mount(attempts) {
      if (window.Site && window.React && window.ReactDOM) {
        try {
          ReactDOM.createRoot(document.getElementById('root'))
            .render(React.createElement(Site, null));
        } catch (e) {
          document.getElementById('root').innerHTML =
            '<div class="react-error">' + (e && e.stack || e) + '</div>';
        }
      } else if (attempts > 0) {
        setTimeout(function() { mount(attempts - 1); }, 50);
      } else {
        document.getElementById('root').innerHTML =
          '<div class="react-error">Timeout: Site component failed to load.</div>';
      }
    })(100);
  </script>
</body>
</html>
